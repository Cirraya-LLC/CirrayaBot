# Public entry point for Multi-Agent (from the dsh web UI experiment).
# dsh web has no authentication at all and the Operator bot has bash — so it listens on
# 127.0.0.1 only, and the internet gets in only through this basic-auth layer. Never run dsh with --host 0.0.0.0.
server {
    listen 80 default_server;
    server_name _;

    auth_basic           "Multi-Agent";
    auth_basic_user_file /etc/nginx/.ma-htpasswd;

    # long tasks run for a long time; don't let the proxy cut the connection
    proxy_read_timeout  86400s;
    proxy_send_timeout  86400s;
    client_max_body_size 100m;

    # WebSocket endpoints can't use basic auth: browsers DON'T send basic-auth credentials on a
    # WS handshake, so nginx would 401 it. Very quiet symptom — every HTTP request is 200, zero
    # console errors, but the event stream is dead, so the preset picker and workspace list never render.
    #
    # What's let through is dsh's own event channel behind the same entry; the page itself still needs the password.
    location ~ ^/api/events\. {
        auth_basic off;
        # A browser WS handshake carries Origin, which dsh's fence checks (curl sends none so it passes
        # while the browser is refused — why curl works yet the page stays empty). Rewrite it to dsh's own origin.
        proxy_set_header Origin http://127.0.0.1:3080;
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        # WebSocket: dsh's UI streams over it; without these two lines the page spins forever
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # dsh's /api has a browser-trust fence that only accepts its own origin; --trusted-host
        # was tried and doesn't accept external addresses. Quiet symptom — the page opens,
        # every request is 200, zero console errors, but the preset picker and workspace list
        # never appear. The real client address is passed via X-Real-IP / X-Forwarded-For.
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
