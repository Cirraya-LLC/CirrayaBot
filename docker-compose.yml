# One command brings up everything: PostgreSQL + Multi-Agent.
#   ./start.sh            the first time (generates .env and the access token)
#   docker compose up -d  afterwards
#
# podman: ./start.sh detects it and uses podman compose; it also points DOCKER_SOCK at
# podman's socket, so the docker client in the container still works.
name: multi-agent

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: multiagent
      POSTGRES_DB: multiagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./start.sh first to generate .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # the app starts faster than the db; without waiting for readiness the first start can't connect
      test: ["CMD-SHELL", "pg_isready -U multiagent -d multiagent"]
      interval: 3s
      timeout: 3s
      retries: 30

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Published to localhost only by default. For access from other machines set BIND_ADDR=0.0.0.0
    # in .env — ACCESS_TOKEN is then the only door, and with AGENT_TOOLS=on there is a shell behind it.
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://multiagent:${POSTGRES_PASSWORD}@db:5432/multiagent
      ACCESS_TOKEN: ${ACCESS_TOKEN:?run ./start.sh first to generate .env}
      AGENT_TOOLS: ${AGENT_TOOLS:-off}
      AGENT_IMAGE: ${AGENT_IMAGE:-multi-agent-worker:2}
      AGENT_MEMORY: ${AGENT_MEMORY:-2g}
      AGENT_CPUS: ${AGENT_CPUS:-2}
      AGENT_EXEC_TIMEOUT: ${AGENT_EXEC_TIMEOUT:-120}
      # change it when running a second deployment on the same machine, or both fight over the same container names
      AGENT_PREFIX: ${AGENT_PREFIX:-ma}
      # ⚠️ Agent containers are SIBLINGS, not children: the left side of -v must be a real host path.
      # Written as /app/workspace they would mount an empty directory, with no error at all.
      WORKSPACE_HOST_PATH: ${WORKSPACE_HOST_PATH:?run ./start.sh first to generate .env}
      # used only to create the first upstream when the database has none; afterwards the UI is authoritative
      BOT_LLM_BASE_URL: ${BOT_LLM_BASE_URL:-}
      BOT_LLM_API_KEY: ${BOT_LLM_API_KEY:-}
      BOT_LLM_MODEL: ${BOT_LLM_MODEL:-}
      BOT_LLM_PROTOCOL: ${BOT_LLM_PROTOCOL:-}
      BOT_LLM_NAME: ${BOT_LLM_NAME:-}
      BOT_LLM_CONTEXT: ${BOT_LLM_CONTEXT:-}
      # The studio (below). The app creates the studio's database role from this password,
      # and is the only thing that holds the token that talks to it.
      STUDIO_URL: http://studio:8090
      STUDIO_TOKEN: ${STUDIO_TOKEN:?run ./start.sh first to generate .env}
      STUDIO_DB_PASSWORD: ${STUDIO_DB_PASSWORD:?run ./start.sh first to generate .env}
      # The other direction: the studio posts "candidates ready" into a group with this token. It opens
      # only /api/events/…, not the platform — the studio never holds ACCESS_TOKEN.
      STUDIO_EVENT_TOKEN: ${STUDIO_EVENT_TOKEN:?run ./start.sh first to generate .env}
      # DeepSeek Harness (below): agents whose model is deepseek-* run their turns there. The app
      # serves their tools on DSH_MCP_PORT, which nothing publishes — only the dsh container reaches it.
      DSH_CONTAINER: ${AGENT_PREFIX:-ma}-dsh
      DSH_MCP_PORT: 8081
      DSH_MCP_URL: http://app:8081/mcp
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      - ${WORKSPACE_HOST_PATH}:/app/workspace

  # The film studio: asset library, shots, model adapters (studio/). Internal only — no port is
  # published, agents can't reach it; the app calls it on their behalf. Model keys for
  # Seedance / GPT image / ComfyUI live here and nowhere else.
  studio:
    build: ./studio
    restart: unless-stopped
    depends_on:
      # the app creates the studio's database role on startup
      app:
        condition: service_healthy
    environment:
      STUDIO_DATABASE_URL: postgres://studio:${STUDIO_DB_PASSWORD}@db:5432/multiagent
      STUDIO_TOKEN: ${STUDIO_TOKEN}
      APP_URL: http://app:8080
      STUDIO_EVENT_TOKEN: ${STUDIO_EVENT_TOKEN}
      NOTIFY_QUIET_MS: ${NOTIFY_QUIET_MS:-15000}
      # Model keys: here and nowhere else (not the app, not any agent container).
      SEEDANCE_BASE_URL: ${SEEDANCE_BASE_URL:-}
      SEEDANCE_API_KEY: ${SEEDANCE_API_KEY:-}
      SEEDANCE_PER_HOUR: ${SEEDANCE_PER_HOUR:-40}
      SEEDANCE_CONCURRENT: ${SEEDANCE_CONCURRENT:-4}
      GPT_IMAGE_BASE_URL: ${GPT_IMAGE_BASE_URL:-https://api.openai.com/v1}
      GPT_IMAGE_API_KEY: ${GPT_IMAGE_API_KEY:-}
      GPT_IMAGE_MODEL: ${GPT_IMAGE_MODEL:-gpt-image-1}
      COMFY_URL: ${COMFY_URL:-}
    # A ComfyUI on this machine is reachable as http://host.docker.internal:8188 (COMFY_URL).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Content-addressed files (studio/store.mjs). A named volume: nothing else mounts it,
      # so it needs no host path, and it works the same under podman.
      - studiodata:/data

  # DeepSeek Harness (deploy/dsh): the model loop for agents whose model is deepseek-*. It idles;
  # the app starts one runtime per turn with `docker exec -i` and hands it the DeepSeek key on
  # stdin. No socket, no volumes, no secrets in its environment: a runtime that went wrong would
  # find nothing here but its own key. The name is fixed so the app can find it — container names
  # are global on the host, hence AGENT_PREFIX, like the agent containers.
  dsh:
    build: ./deploy/dsh
    restart: unless-stopped
    container_name: ${AGENT_PREFIX:-ma}-dsh

volumes:
  pgdata:
  studiodata:
