# Client packages: Windows, macOS, Linux and Android, built on GitHub's machines.
#
# A tag v* (e.g. v0.2.0) publishes them as a GitHub release with that version; running the workflow by hand only
# builds them and keeps them as downloads on the run (nothing is published).
#
# Not signed by Apple or Microsoft: macOS asks the first time (right-click → Open), Windows SmartScreen asks too.
# Android is signed with the keystore in the repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD; without them with a throwaway debug key, and a later build can't be
# installed over that one (the release notes say which).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.1

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
    steps:
      - id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "name=$v" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', cache: true }
      - id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APKs are signed with a throwaway debug key"
            echo "signed=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi --build-name "${{ needs.version.outputs.name }}" --build-number "${{ github.run_number }}"
      - name: Package
        run: |
          mkdir -p ../dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "../dist/CirrayaBot-${{ needs.version.outputs.name }}-android-$abi.apk"
          done
      - uses: actions/upload-artifact@v4
        with: { name: android, path: dist/*, if-no-files-found: error }

  macos:
    needs: version
    runs-on: macos-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', cache: true }
      - run: flutter build macos --release --build-name "${{ needs.version.outputs.name }}" --build-number "${{ github.run_number }}"
      - name: Package
        # The bundle is named after the product here; its contents (and its ad-hoc signature) are left as built.
        run: |
          mkdir -p ../dist
          cp -R build/macos/Build/Products/Release/multi_agent.app "$RUNNER_TEMP/CirrayaBot.app"
          ditto -c -k --keepParent "$RUNNER_TEMP/CirrayaBot.app" "../dist/CirrayaBot-${{ needs.version.outputs.name }}-macos.zip"
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: dist/*, if-no-files-found: error }

  windows:
    needs: version
    runs-on: windows-latest
    defaults: { run: { working-directory: app, shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', cache: true }
      - run: flutter build windows --release --build-name "${{ needs.version.outputs.name }}" --build-number "${{ github.run_number }}"
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ../dist | Out-Null
          Copy-Item -Recurse build/windows/x64/runner/Release "$env:RUNNER_TEMP/CirrayaBot"
          Compress-Archive -Path "$env:RUNNER_TEMP/CirrayaBot" -DestinationPath "../dist/CirrayaBot-${{ needs.version.outputs.name }}-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/*, if-no-files-found: error }

  linux:
    needs: version
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', cache: true }
      - run: flutter build linux --release --build-name "${{ needs.version.outputs.name }}" --build-number "${{ github.run_number }}"
      - name: Package
        run: |
          mkdir -p ../dist "$RUNNER_TEMP/pkg"
          cp -R build/linux/x64/release/bundle "$RUNNER_TEMP/pkg/CirrayaBot"
          tar -C "$RUNNER_TEMP/pkg" -czf "../dist/CirrayaBot-${{ needs.version.outputs.name }}-linux-x64.tar.gz" CirrayaBot
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/*, if-no-files-found: error }

  publish:
    if: github.ref_type == 'tag'
    needs: [version, android, macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: Notes
        run: |
          {
            echo "Client packages for CirrayaBot ${{ needs.version.outputs.name }}. The server is deployed with ./start.sh (see the README)."
            echo
            echo "- **macOS**: unzip and move CirrayaBot to Applications. It isn't signed by Apple: the first time, right-click it and choose Open."
            echo "- **Windows**: unzip and run multi_agent.exe. SmartScreen may ask the first time (More info → Run anyway)."
            echo "- **Linux**: untar and run CirrayaBot/multi_agent (needs GTK 3)."
            if [ "${{ needs.android.outputs.signed }}" = yes ]; then
              echo "- **Android**: install the APK for your phone (arm64-v8a for most phones)."
            else
              echo "- **Android**: install the APK for your phone (arm64-v8a for most phones). ⚠️ Signed with a throwaway key: to update, uninstall the old app first (your server address is asked again)."
            fi
            echo
            echo "Check a download against SHA256SUMS.txt."
          } > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: dist/*
