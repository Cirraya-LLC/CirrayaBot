# Mount the bots/ roster in one-shot task mode, to verify a Bot's identity and no-go zones.
# The key is read only from the environment (apiKeyEnv is a variable name, not the key); never written to a file.

- id: llm-deepseek
  config:
    baseURL: !!js process.env.BOT_LLM_BASE_URL
    apiKeyEnv: BOT_LLM_API_KEY
    thinking: disabled

- id: agent-default-model
  config:
    provider: deepseek-official
    model: !!js process.env.BOT_LLM_MODEL

- insert:
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: !!js process.env.BOT_PRESET ?? 'researcher'
        roots:
          - path: !!js require('node:path').resolve(process.cwd(), 'bots')
            trust: user
        includeUserRoot: false

# ⚠️ Without the section below, a Bot's no-go zones are fake.
#
# The preset scope chain is agent → preset → global, nearest shadowing farthest — a preset can
# only ADD and SHADOW at the agent layer; it CANNOT REMOVE tools the global layer already has.
# headless disables none of its 18 tool-* rows, so a Bot whose preset gives no bash still gets
# bash from the global layer, and everything looks normal: preset loaded, persona in effect,
# only the tool table is wrong. (Verified once: Researcher reported having bash / write / edit.)
#
# dsh's official web profile does exactly this: disables 17 of the 18, keeping only
# tool-subagent-report (the child→parent channel, registered in child scope, not a model tool).

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: tool-jobs
  disabled: true

- id: tool-fs
  disabled: true

- id: tool-fs-search
  disabled: true

- id: tool-skill
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: tool-workflow
  disabled: true

- id: tool-result-pruner
  disabled: true

- id: tool-todo
  disabled: true

- id: tool-goal
  disabled: true

- id: tool-ralph
  disabled: true

- id: tool-str-replace-editor
  disabled: true

- id: tool-web
  disabled: true
