<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>登录 · CirrayaBot</title>
<style>
  :root{color-scheme:dark;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:#ececf0;background:#0e0e10}
  *{box-sizing:border-box}
  body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px}
  main{width:min(100%,380px);padding:32px;background:#18181b;border:1px solid #2a2a30;border-radius:16px;box-shadow:0 18px 60px #0007}
  .mark{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:#2f4a86;color:#fff;font-size:20px;font-weight:700}
  h1{margin:22px 0 5px;font-size:23px;line-height:1.25}
  p{margin:0;color:#a4a4ad;font-size:14px}
  form{margin-top:25px}
  label{display:block;margin-bottom:8px;font-size:14px;font-weight:600}
  input{width:100%;height:46px;padding:0 13px;border:1px solid #3a3a44;border-radius:9px;background:#111114;color:#ececf0;font:inherit;outline:none}
  input:focus{border-color:#5b8cff;box-shadow:0 0 0 3px #5b8cff33}
  button{width:100%;height:44px;margin-top:16px;border:0;border-radius:9px;background:#5b8cff;color:#0e1014;font:inherit;font-weight:700;cursor:pointer}
  button:disabled{opacity:.6;cursor:wait}
  [role=status]{min-height:22px;margin-top:12px;color:#ea8890;font-size:13px}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">C</div>
  <h1 id="title">登录 CirrayaBot</h1>
  <p id="hint">这是受保护的私人部署，请输入登录密码。</p>
  <form id="login-form">
    <label id="password-label" for="password">登录密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <button id="submit" type="submit">登录</button>
    <p id="status" role="status" aria-live="polite"></p>
  </form>
</main>
<script type="module" src="/login.js"></script>
</body>
</html>
