<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multi-Agent</title>
<style>
  :root{
    --bg:#0e0e10; --side:#18181b; --panel:#1f1f23; --bub:#26262b; --line:#2a2a30;
    --ink:#ececf0; --dim:#8b8b95; --dim2:#6a6a74;
    --accent:#5b8cff; --code:#ff7b72; --ok:#3ecf8e; --warn:#ffb454;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;display:flex;background:var(--bg);color:var(--ink);overflow:hidden;
       font:14px/1.62 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}

  /* ═══ Left: conversation list ═══ */
  aside{width:308px;flex:none;background:var(--side);display:flex;flex-direction:column;
        border-right:1px solid var(--line)}
  .top{padding:14px 14px 10px;display:flex;gap:8px;align-items:center}
  .search{flex:1;display:flex;align-items:center;gap:7px;background:#232328;border-radius:9px;
          padding:7px 11px}
  .search input{flex:1;background:none;border:0;outline:none;color:var(--ink);font:inherit;font-size:13px}
  .search input::placeholder{color:var(--dim2)}
  .plus{width:30px;height:30px;border-radius:8px;font-size:19px;color:var(--dim);flex:none}
  .plus:hover{background:#232328;color:var(--ink)}

  .convs{flex:1;overflow-y:auto;padding:2px 8px 8px}
  .conv{display:flex;gap:10px;padding:9px 9px;border-radius:10px;cursor:pointer;align-items:flex-start}
  .conv:hover{background:#212127}
  .conv.on{background:#2a2a31}
  .av{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;
      font-size:14px;font-weight:600;color:#0e0e10;position:relative}
  .av.stack{background:none}
  .av.stack i{position:absolute;width:23px;height:23px;border-radius:50%;border:2px solid var(--side)}
  .av .more{position:absolute;right:-2px;bottom:-2px;background:#3a3a42;color:var(--ink);
            font-size:9px;font-weight:600;border-radius:9px;padding:1px 4px;border:2px solid var(--side)}
  .cbody{flex:1;min-width:0}
  .crow{display:flex;align-items:center;gap:6px}
  .cname{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tag{background:#33333b;color:#a5a5b0;border-radius:5px;padding:1px 6px;font-size:10.5px;
       font-weight:500;white-space:nowrap;flex:none}
  .ctime{margin-left:auto;color:var(--dim2);font-size:11px;flex:none}
  .cprev{color:var(--dim);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
         margin-top:1px}
  .foot{border-top:1px solid var(--line);padding:9px 14px;display:flex;flex-direction:column;gap:2px}
  .fitem{display:flex;align-items:center;gap:10px;padding:7px 6px;border-radius:8px;color:var(--dim);
         font-size:13px}
  .fitem:hover{background:#232328;color:var(--ink)}
  .fitem b{width:22px;height:22px;border-radius:6px;background:#2f2f37;display:grid;place-items:center;
           font-size:11px;font-weight:600;color:var(--dim)}

  /* ═══ Middle: chat ═══ */
  main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
  header{height:54px;flex:none;display:flex;align-items:center;gap:10px;padding:0 18px;
         border-bottom:1px solid var(--line)}
  header .av{width:28px;height:28px;font-size:11px}
  header .av.stack i{width:18px;height:18px}
  .htitle{font-weight:600;font-size:14px}
  .hsub{color:var(--dim2);font-size:12px}
  .hact{margin-left:auto;display:flex;gap:4px;color:var(--dim)}
  .hact button{width:30px;height:30px;border-radius:7px;font-size:15px}
  .hact button:hover{background:#232328;color:var(--ink)}

  .log{flex:1;overflow-y:auto;padding:20px 26px 8px;display:flex;flex-direction:column;gap:2px}
  .msg{display:flex;gap:9px;align-items:flex-end;max-width:min(68%,720px);margin-bottom:12px}
  .msg .mav{width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;
            font-size:10px;font-weight:600;color:#0e0e10;margin-bottom:2px}
  .mwrap{min-width:0}
  .mname{font-size:12px;font-weight:500;margin:0 0 4px 1px}
  .bub{background:var(--bub);border-radius:13px;padding:9px 13px;white-space:pre-wrap;
       word-break:break-word;font-size:13.5px;line-height:1.66}
  .msg.me{align-self:flex-end;flex-direction:row-reverse}
  .msg.me .bub{background:#2f4a86}
  .msg.me .mname{display:none}
  .bub code{background:#33232a;color:var(--code);border-radius:4px;padding:1px 5px;
            font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
  .bub .at{background:#2f3a52;color:#9dc0ff;border-radius:5px;padding:1px 6px 1px 3px;
           font-size:12.5px;white-space:nowrap}
  .bub .cb{background:#141418;border:1px solid var(--line);border-radius:8px;padding:9px 11px;
           margin:7px 0;overflow-x:auto;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
           color:#c9d1d9;white-space:pre}
  .bub .cb b{display:block;color:var(--dim2);font-size:10.5px;font-weight:500;margin-bottom:5px;
             text-transform:uppercase;letter-spacing:.5px}
  .bub .at i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-2px;
             margin-right:3px}
  .day{align-self:center;color:var(--dim2);font-size:11.5px;margin:6px 0 14px}

  .tool{max-width:min(78%,860px);background:#17171b;border:1px solid var(--line);border-radius:11px;
        padding:8px 12px;margin:0 0 12px 31px;font-size:12px}
  .tool .th{display:flex;align-items:center;gap:7px;color:var(--dim)}
  .tool .th i{width:7px;height:7px;border-radius:50%;flex:none}
  .tool code{color:#9ecbff;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;word-break:break-all}
  .tool pre{margin:7px 0 0;white-space:pre-wrap;word-break:break-word;color:var(--dim);
            font-family:ui-monospace,Menlo,monospace;font-size:11px;max-height:180px;overflow:auto}
  .tool.run .th::after{content:'…';color:var(--warn)}
  .note{align-self:center;color:var(--dim2);font-size:11.5px;background:#1b1b20;border:1px solid var(--line);
        border-radius:20px;padding:3px 13px;margin-bottom:12px}
  .empty{margin:auto;text-align:center;color:var(--dim);max-width:420px;padding-bottom:60px}
  .empty h2{color:var(--ink);font-size:17px;margin:0 0 10px;font-weight:600}
  .empty p{margin:7px 0;font-size:13px;line-height:1.7}

  .composer{flex:none;padding:10px 26px 20px}
  .cbox{display:flex;align-items:flex-end;gap:10px;background:var(--panel);border:1px solid var(--line);
        border-radius:15px;padding:7px 8px 7px 12px}
  .cbox textarea{flex:1;resize:none;background:none;border:0;outline:none;color:var(--ink);
                 font:inherit;font-size:13.5px;padding:6px 0;max-height:170px;min-height:26px}
  .cbox textarea::placeholder{color:var(--dim2)}
  .cbox .go{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;
            font-size:14px;flex:none}
  .cbox .go:disabled{background:#33333b;color:var(--dim2)}
  .cadd{width:30px;height:30px;border-radius:50%;background:#2f2f37;color:var(--dim);font-size:16px;flex:none}
  .composer{position:relative}
  .mention{position:absolute;left:26px;bottom:calc(100% - 6px);min-width:220px;max-width:320px;background:#26262d;
           border:1px solid var(--line);border-radius:12px;padding:5px;box-shadow:0 8px 24px #0006;z-index:5}
  .mention.hide{display:none}
  .mention div{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:8px;font-size:13px;cursor:pointer}
  .mention div.on{background:#34343c}
  .mention .av{width:22px;height:22px;font-size:10px}
  .mention small{color:var(--dim2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ═══ Right: members ═══ */
  .side2{width:290px;flex:none;background:var(--side);border-left:1px solid var(--line);
         display:flex;flex-direction:column}
  .side2.hide{display:none}
  .s2h{padding:16px 18px 8px;font-size:13px;font-weight:600}
  .mem{display:flex;align-items:center;gap:10px;padding:8px 18px;font-size:13.5px}
  .mem .av{width:26px;height:26px;font-size:11px}
  .mem .lead{font-size:10.5px;padding:1px 6px;border-radius:5px;background:#1e2d45;color:#8fb6ff}
  .mem .x{margin-left:auto;color:var(--dim2);font-size:15px;visibility:hidden}
  .mem:hover{background:#212127}
  .mem:hover .x{visibility:visible}
  .mem .x:hover{color:var(--warn)}
  .addm{display:flex;align-items:center;gap:10px;padding:8px 18px;color:var(--dim);font-size:13.5px;
        cursor:pointer;width:100%}
  .addm:hover{color:var(--ink)}
  .addm b{width:26px;height:26px;border-radius:50%;background:#2f2f37;display:grid;place-items:center;font-size:14px}
  .rhint{color:var(--dim2);font-size:11.5px;line-height:1.6;display:block;margin:-2px 0 8px}
  .s2mem{border-top:1px solid var(--line);margin-top:auto;padding:14px 18px;display:flex;
         flex-direction:column;gap:8px}
  .s2mem small{color:var(--dim2);font-size:11.5px;line-height:1.6}
  .s2mem textarea{background:#151519;border:1px solid var(--line);border-radius:9px;color:var(--ink);
                  font:12.5px/1.6 ui-monospace,Menlo,monospace;padding:9px 11px;height:150px;resize:none;outline:none}
  .s2mem .row{display:flex;gap:8px;align-items:center}
  .btn{background:#2f2f37;border-radius:8px;padding:6px 12px;font-size:12.5px;color:var(--ink)}
  .btn:hover{background:#3a3a44}
  .btn.pri{background:var(--accent);color:#fff}

  dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:15px;
         padding:20px 22px;min-width:380px;max-width:92vw;max-height:88vh;overflow:auto}
  dialog::backdrop{background:#000b}
  dialog h4{margin:0 0 14px;font-size:15px;font-weight:600}
  dialog input[type=text],dialog input[type=password],dialog input[type=number],dialog textarea,dialog select{width:100%;background:#151519;color:var(--ink);
    border:1px solid var(--line);border-radius:9px;padding:10px 12px;font:inherit;font-size:13.5px;
    margin-bottom:10px;outline:none}
  dialog textarea{resize:vertical;min-height:120px;line-height:1.7}
  .brow{display:flex;gap:8px}
  .brow>*{flex:1;min-width:0}
  dialog .pick{display:flex;gap:9px;align-items:center;padding:7px 4px;font-size:13.5px;cursor:pointer;border-radius:8px}
  dialog .pick:hover{background:#26262c}
  dialog .pick input{accent-color:var(--accent);width:15px;height:15px}
  dialog .pick .av{width:26px;height:26px;font-size:11px}
  dialog .pick small{color:var(--dim);font-size:11.5px}
  /* Action row sticks to the bottom: long dialogs (provider list, long persona) would
     otherwise push the buttons people need out of view. */
  dialog .acts{display:flex;gap:9px;justify-content:flex-end;margin-top:16px;
               position:sticky;bottom:-20px;background:var(--panel);
               padding:10px 0 20px;margin-bottom:-20px}

  /* Model providers */
  /* Scroll the list, not the whole dialog, so the action buttons stay in view */
  #plist,#klist{max-height:32vh;overflow-y:auto;margin:-4px -4px 0}
  .pitem{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:9px;cursor:pointer;
         border:1px solid transparent}
  .pitem:hover{background:#26262c}
  .pitem.on{border-color:var(--accent);background:#1c2333}
  .pitem .pn{flex:1;min-width:0}
  .pitem b{display:block;font-size:13.5px;font-weight:600}
  .pitem small{display:block;color:var(--dim);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pitem .dot{width:8px;height:8px;border-radius:50%;background:#3a3a44;flex:none}
  .pitem.def .dot{background:var(--ok)}
  .psplit{border-top:1px solid var(--line);margin:14px 0 12px}
  .prow{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:2px 0 8px}
  .prow label{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--dim);cursor:pointer}
  .prow input[type=radio]{accent-color:var(--accent);width:14px;height:14px}
  .prow input[type=number]{width:120px;margin:0}
  .phint{display:block;color:var(--dim);font-size:11.5px;min-height:17px}
  .phint.bad{color:var(--code)} .phint.good{color:var(--ok)}
</style>
</head>
<body>

<aside>
  <div class="top">
    <div class="search">
      <span style="color:var(--dim2);font-size:12px">⌕</span>
      <input id="q" data-i18n-placeholder="side.search" autocomplete="off">
    </div>
    <button class="plus" id="newconv" data-i18n-title="side.newGroup">＋</button>
  </div>
  <div class="convs" id="convs"></div>
  <div class="foot">
    <button class="fitem" id="newbot"><b>＋</b> <span data-i18n="side.newAgent"></span></button>
    <button class="fitem" id="prov"><b>⚙</b> <span data-i18n="side.providers"></span></button>
    <label class="fitem"><b>🌐</b> <select id="lang" data-i18n-aria-label="common.language"
      style="flex:1;background:none;border:0;color:inherit;font:inherit;outline:none;cursor:pointer"></select></label>
    <div class="fitem" style="cursor:default"><b>C</b> Cirraya</div>
  </div>
</aside>

<main>
  <header>
    <div class="av" id="hav" style="background:#2f2f37"></div>
    <div>
      <div class="htitle" id="htitle" data-i18n="head.pick"></div>
      <div class="hsub" id="hsub" data-i18n="head.pickSub"></div>
    </div>
    <div class="hact">
      <button id="hedit" data-i18n-title="common.edit">⚙</button>
      <button id="htoggle" data-i18n-title="head.toggle">»</button>
    </div>
  </header>
  <div class="log" id="log"></div>
  <div class="composer">
    <div class="mention hide" id="mention"></div>
    <div class="cbox">
      <button class="cadd" id="cadd" data-i18n-title="comp.memory">＋</button>
      <textarea id="in" rows="1" data-i18n-placeholder="comp.pick"></textarea>
      <button class="go" id="send" disabled>↑</button>
    </div>
  </div>
</main>

<div class="side2" id="side2">
  <div class="s2h" data-i18n="s2.members"></div>
  <div id="members"></div>
  <button class="addm" id="addmem"><b>＋</b> <span data-i18n="s2.addMember"></span></button>
  <div class="s2mem">
    <small id="memtitle" data-i18n="mem.title"></small>
    <textarea id="mem" data-i18n-placeholder="mem.agentPh"></textarea>
    <div class="row"><button class="btn" id="msave" data-i18n="common.save"></button><small id="mstat"></small></div>
    <div class="row"><button class="btn" id="xexp" data-i18n="s2.exportChat"></button><button class="btn" id="ximp" data-i18n="common.import"></button>
      <input type="file" id="xfile" accept="application/json,.json" hidden></div>
  </div>
</div>

<dialog id="gdlg">
  <h4 id="gtitle" data-i18n="g.new"></h4>
  <input type="text" id="gname" data-i18n-placeholder="g.namePh" autocomplete="off">
  <div id="gmembers"></div>
  <small class="rhint" style="margin-top:10px" data-i18n="g.leadHint"></small>
  <select id="glead"></select>
  <div class="acts">
    <button class="btn" style="margin-right:auto;color:#e06c75" id="gdel" data-i18n="g.disband"></button>
    <button class="btn" id="gcancel" data-i18n="common.cancel"></button>
    <button class="btn pri" id="gsave" data-i18n="g.create"></button>
  </div>
</dialog>

<dialog id="bdlg">
  <h4 id="btitle" data-i18n="b.new"></h4>
  <input type="text" id="bname" data-i18n-placeholder="b.namePh" autocomplete="off">
  <input type="text" id="bdesc" data-i18n-placeholder="b.descPh" autocomplete="off">
  <textarea id="bpersona" data-i18n-placeholder="b.personaPh"></textarea>
  <div class="brow">
    <select id="bprov" data-i18n-title="b.provTitle"></select>
    <select id="bmodel" data-i18n-title="b.modelTitle"></select>
    <input type="text" id="bmodelx" data-i18n-placeholder="b.modelPh" autocomplete="off" hidden>
  </div>
  <div class="acts">
    <button class="btn" style="margin-right:auto;color:#e06c75" id="bdel" data-i18n="common.delete"></button>
    <button class="btn" id="bcancel" data-i18n="common.cancel"></button>
    <button class="btn pri" id="bsave" data-i18n="common.save"></button>
  </div>
</dialog>

<dialog id="pdlg">
  <h4 data-i18n="p.title"></h4>
  <div id="plist"></div>
  <div class="psplit"></div>
  <h4 id="ptitle" style="margin-bottom:10px" data-i18n="p.add"></h4>
  <input type="text" id="pname" data-i18n-placeholder="p.namePh" autocomplete="off">
  <select id="pproto" data-i18n-title="p.protoTitle">
    <option value="chat">OpenAI Chat Completions (/chat/completions)</option>
    <option value="responses">OpenAI Responses (/responses)</option>
    <option value="messages">Anthropic Messages (/messages)</option>
  </select>
  <input type="text" id="purl" data-i18n-placeholder="p.urlPh" autocomplete="off">
  <input type="password" id="pkey" data-i18n-placeholder="p.keyPh" autocomplete="off">
  <div class="prow">
    <label><input type="radio" name="pctx" value="auto" checked> <span data-i18n="p.ctxAuto"></span></label>
    <label><input type="radio" name="pctx" value="manual"> <span data-i18n="p.ctxManual"></span></label>
    <input type="number" id="pctxn" placeholder="128000" min="2000" step="1000" disabled>
    <button class="btn" id="ptest" data-i18n="p.test"></button>
  </div>
  <small class="phint" id="phint" data-i18n="p.hint"></small>
  <div class="acts">
    <button class="btn" style="margin-right:auto;color:#e06c75;display:none" id="pdel" data-i18n="common.delete"></button>
    <button class="btn" id="pnew" data-i18n="common.new"></button>
    <button class="btn" id="pclose" data-i18n="common.close"></button>
    <button class="btn pri" id="psave" data-i18n="common.save"></button>
  </div>
</dialog>

<script type="module" src="./app.js"></script>
</body>
</html>
