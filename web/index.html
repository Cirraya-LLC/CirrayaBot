<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CirrayaBot Studio</title>
<script>
  // Before first paint: a deferred module would show a dark flash in light mode,
  // and the sidebar would appear wide and then snap.
  try {
    var t = localStorage.getItem('ma_theme') || 'system'
    document.documentElement.dataset.theme =
      t === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : t
    // A narrow window starts with the rail, unless the person expanded it there before.
    var rail = localStorage.getItem('ma_rail')
    if (rail === '1' || (rail === null && innerWidth < 760)) document.documentElement.classList.add('rail')
  } catch (e) {}
</script>
<style>
  /* ═══ Design tokens ═══
     Every colour in this file is one of these. Dark is the default; the light
     theme below overrides the same names, so no rule below ever names a theme.

     Light is not the dark theme inverted. The surface *relationships* are kept
     — the composer, tool cards and bubbles sit above the canvas, input wells
     sit below it — but the base flips: in dark the chrome is lighter than the
     canvas, in light the chrome is tinted grey and the content is white, which
     is what a light workspace looks like.

     Contrast: every text/surface pair actually used clears WCAG AA (4.5:1).
     The dimmest text is 4.56:1 in dark, 4.70:1 in light. */
  :root{
    color-scheme:dark;
    --bg:#0e0e10; --side:#18181b; --panel:#1f1f23; --line:#2a2a30;
    --bub:#26262b; --bubme:#2f4a86; --tool:#17171b; --cb:#141418; --field:#151519;
    --raise:#232328;        /* search well, hover on a panel */
    --hover:#212127;        /* row hover */
    --on:#2a2a31;           /* selected row */
    --chip:#2f2f37;         /* buttons, icon chips, tags */
    --chip2:#3a3a44;        /* chip hover, dots */
    --ink:#ececf0; --dim:#919199; --dim2:#8a8a94; --chipink:#c2c2cc; --cbink:#c9d1d9;
    --accent:#5b8cff; --onacc:#0e1014;   /* near-black on the accent: white reads 3.2:1 */
    --code:#ff7b72; --codebg:#33232a;
    --tint:#22314d; --tintink:#9dc0ff;   /* blue-tinted badges: @pills, lead, running */
    --cbline:var(--line);   /* a code block sits on a bubble, not on the canvas */
    --bad:#ea8890; --badbg:#3a2226;
    --ok:#3ecf8e; --warn:#ffb454; --warnbg:#3a3122;
    --scrim:#000b; --shadow:#0006;
    --avink:#0e0e10;        /* the letter on an Agent's own colour: same in both themes */
    /* Sidebar: laid out at --wide always, clipped to --rail when collapsed, so
       nothing inside ever reflows. --rail puts the 38px avatar dead centre. */
    --wide:308px; --rail:72px; --side2:290px;
    --dur:200ms; --dur2:130ms; --ease:cubic-bezier(.4,0,.2,1);
  }
  :root[data-theme="light"]{
    color-scheme:light;
    /* White canvas, grey bubbles, tinted chrome — the light-IM arrangement.
       Pinning the canvas at white and tinting the bubble is what keeps an
       incoming message visible; a white bubble on an off-white canvas is not. */
    --bg:#ffffff; --side:#f4f6f9; --panel:#ffffff; --line:#dfe3ea;
    --bub:#eaedf3; --bubme:#d8e6ff; --tool:#f7f9fb; --cb:#e5e9ef; --field:#eef1f6;
    --raise:#e9ecf2; --hover:#e8ebf1; --on:#dde3ee; --chip:#dfe4ec; --chip2:#cfd6e0;
    --ink:#14161b; --dim:#58606e; --dim2:#616875; --chipink:#3c434f; --cbink:#1f2328;
    --accent:#215ae0; --onacc:#ffffff;
    --code:#b3261e; --codebg:#fceceb;
    --tint:#e3ecfd; --tintink:#1d4ed8; --cbline:#c9d0da;
    --bad:#b3261e; --badbg:#fdeaea;
    --ok:#0b6e47; --warn:#7a5000; --warnbg:#fbf0da;
    --scrim:#1b1f2799; --shadow:#0f172a26;
  }
  @media (prefers-reduced-motion:reduce){ :root{ --dur:0ms; --dur2:0ms } }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;display:flex;background:var(--bg);color:var(--ink);overflow:hidden;
       font:14px/1.62 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}

  /* ═══ Left: conversation list ═══
     Collapsing animates the aside's width only. Everything inside keeps its
     --wide layout and is clipped, so no row ever reflows mid-animation: the
     labels fade out, the avatars do not move a pixel. --rail (72px) is chosen
     so the 38px avatar — at 8px list padding + 9px row padding — is already
     centred in the rail. */
  aside{width:var(--wide);flex:none;background:var(--side);display:flex;flex-direction:column;
        border-right:1px solid var(--line);overflow:hidden;transition:width var(--dur) var(--ease)}
  html.rail aside{width:var(--rail)}
  aside>*{width:var(--wide);flex:none}

  /* Two layers, cross-faded. Each is pinned to the width it belongs to, so
     neither drifts while the aside animates — they only fade. */
  .top{position:relative;height:56px}
  .top>div{position:absolute;top:0;bottom:0;left:0;display:flex;align-items:center;
           transition:opacity var(--dur2) var(--ease)}
  .top>.wide{width:var(--wide);gap:8px;padding:14px 14px 10px}
  .top>.railonly{width:var(--rail);gap:8px;padding:14px 0 10px;justify-content:center;
                 opacity:0;pointer-events:none}
  html.rail .top>.wide{opacity:0;pointer-events:none}
  html.rail .top>.railonly{opacity:1;pointer-events:auto}
  .search{flex:1;display:flex;align-items:center;gap:7px;background:var(--raise);border-radius:9px;
          padding:7px 11px}
  .search input{flex:1;background:none;border:0;outline:none;color:var(--ink);font:inherit;font-size:13px}
  .search input::placeholder{color:var(--dim2)}
  .plus{width:30px;height:30px;border-radius:8px;font-size:19px;color:var(--dim);flex:none}
  .plus:hover{background:var(--raise);color:var(--ink)}

  /* Labels fade out quickly, and fade back in only once there is room for them. */
  .cbody,.fitem>span{transition:opacity var(--dur2) var(--ease) calc(var(--dur) - var(--dur2))}
  html.rail .cbody,html.rail .fitem>span{opacity:0;transition-delay:0s}

  .convs{flex:1 1 auto;overflow-y:auto;padding:2px 8px 8px}
  html.rail .conv{background:none}
  html.rail .conv:hover .av{box-shadow:0 0 0 3px var(--raise)}
  html.rail .conv.on .av{box-shadow:0 0 0 2px var(--side),0 0 0 4px var(--accent)}
  .conv{display:flex;gap:10px;padding:9px 9px;border-radius:10px;cursor:pointer;align-items:flex-start}
  .conv:hover{background:var(--hover)}
  .conv.on{background:var(--on)}
  .av{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;
      font-size:14px;font-weight:600;color:var(--avink);position:relative}
  .av.stack{background:none}
  .av.stack i{position:absolute;width:23px;height:23px;border-radius:50%;border:2px solid var(--side)}
  .av .more{position:absolute;right:-2px;bottom:-2px;background:var(--chip2);color:var(--ink);
            font-size:9px;font-weight:600;border-radius:9px;padding:1px 4px;border:2px solid var(--side)}
  .cbody{flex:1;min-width:0}
  .crow{display:flex;align-items:center;gap:6px}
  .cname{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tag{background:var(--chip);color:var(--chipink);border-radius:5px;padding:1px 6px;font-size:10.5px;
       font-weight:500;white-space:nowrap;flex:none}
  .ctime{margin-left:auto;color:var(--dim2);font-size:11px;flex:none}
  .cprev{color:var(--dim);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
         margin-top:1px}
  .foot{border-top:1px solid var(--line);padding:9px 14px;display:flex;flex-direction:column;gap:2px}
  /* 11px so the icon chip lands on the same vertical axis as the avatars
     above it — which is also the centre of the rail. */
  .fitem{display:flex;align-items:center;gap:10px;padding:7px 11px;border-radius:8px;
         position:relative;color:var(--dim);font-size:13px}
  .fitem:hover{background:var(--raise);color:var(--ink)}
  .fitem b{width:22px;height:22px;border-radius:6px;background:var(--chip);display:grid;place-items:center;
           font-size:11px;font-weight:600;color:var(--dim)}

  .foot select,.proj select{flex:1;min-width:0;background:none;border:0;padding:0;color:inherit;font:inherit;
               outline:none;cursor:pointer}
  html.rail .foot select,html.rail .proj select{position:absolute;inset:0;width:100%;opacity:0}
  .proj select option,.foot select option{background:var(--panel);color:var(--ink)}

  /* ═══ The film studio: project block in the sidebar ═══ */
  .proj{padding:0 14px 6px;display:flex;flex-direction:column;gap:2px}
  .proj[hidden]{display:none}
  .proj .fitem.cur{color:var(--ink);font-weight:600}
  .fitem.on{background:var(--on);color:var(--ink)}
  .sech{padding:10px 25px 4px;font-size:11px;font-weight:600;color:var(--dim2);letter-spacing:.3px;
        transition:opacity var(--dur2) var(--ease)}
  .sech[hidden]{display:none}
  html.rail .sech{opacity:0}

  /* Collapsed, the name is the only thing left to identify a row by. One
     floating tip serves the whole rail — an absolutely positioned one would be
     clipped by the conversation list's own scrolling. */
  #tip{position:fixed;z-index:60;transform:translateY(-50%);background:var(--panel);color:var(--ink);
       border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12.5px;
       white-space:nowrap;pointer-events:none;box-shadow:0 6px 20px var(--shadow);max-width:260px;
       overflow:hidden;text-overflow:ellipsis}
  #tip[hidden]{display:none}
  .fitem b.half::before{content:'';width:12px;height:12px;border-radius:50%;
    border:1.5px solid currentColor;background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ═══ Middle: chat ═══ */
  main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
  header{height:54px;flex:none;display:flex;align-items:center;gap:10px;padding:0 18px;
         border-bottom:1px solid var(--line)}
  header .av{width:28px;height:28px;font-size:11px}
  header .av.stack i{width:18px;height:18px}
  .htitle{font-weight:600;font-size:14px}
  .hsub{color:var(--dim2);font-size:12px}
  .hact{margin-left:auto;display:flex;gap:4px;color:var(--dim)}
  .hact button{width:30px;height:30px;border-radius:7px;font-size:15px}
  .hact button:hover{background:var(--raise);color:var(--ink)}

  .log{flex:1;overflow-y:auto;padding:20px 26px 8px;display:flex;flex-direction:column;gap:2px}
  .msg{display:flex;gap:9px;align-items:flex-end;max-width:min(68%,720px);margin-bottom:12px}
  .msg .mav{width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;
            font-size:10px;font-weight:600;color:var(--avink);margin-bottom:2px}
  .mwrap{min-width:0}
  .mname{font-size:12px;font-weight:500;margin:0 0 4px 1px}
  .bub{background:var(--bub);border-radius:13px;padding:9px 13px;white-space:pre-wrap;
       word-break:break-word;font-size:13.5px;line-height:1.66}
  .msg.me{align-self:flex-end;flex-direction:row-reverse}
  .msg.me .bub{background:var(--bubme)}
  .msg.me .mname{display:none}
  .bub code{background:var(--codebg);color:var(--code);border-radius:4px;padding:1px 5px;
            font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
  .bub .at{background:var(--tint);color:var(--tintink);border-radius:5px;padding:1px 6px 1px 3px;
           font-size:12.5px;white-space:nowrap}
  .bub .cb{background:var(--cb);border:1px solid var(--cbline);border-radius:8px;padding:9px 11px;
           margin:7px 0;overflow-x:auto;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
           color:var(--cbink);white-space:pre}
  .bub .cb b{display:block;color:var(--dim2);font-size:10.5px;font-weight:500;margin-bottom:5px;
             text-transform:uppercase;letter-spacing:.5px}
  .bub .at i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-2px;
             margin-right:3px}
  .day{align-self:center;color:var(--dim2);font-size:11.5px;margin:6px 0 14px}

  .tool{max-width:min(78%,860px);background:var(--tool);border:1px solid var(--line);border-radius:11px;
        padding:8px 12px;margin:0 0 12px 31px;font-size:12px}
  .tool .th{display:flex;align-items:center;gap:7px;color:var(--dim)}
  .tool .th i{width:7px;height:7px;border-radius:50%;flex:none}
  .tool code{color:var(--tintink);font-family:ui-monospace,Menlo,monospace;font-size:11.5px;word-break:break-all}
  .tool img{display:block;max-width:min(100%,520px);margin-top:8px;border:1px solid var(--line);border-radius:8px;cursor:zoom-in}
  .tool pre{margin:7px 0 0;white-space:pre-wrap;word-break:break-word;color:var(--dim);
            font-family:ui-monospace,Menlo,monospace;font-size:11px;max-height:180px;overflow:auto}
  .tool.run .th::after{content:'…';color:var(--warn)}
  /* A card waiting on a person: the border colour is the signal, the buttons are the answer. */
  .tool:has(.ask){border-color:var(--warn)}
  .tool .ask{display:flex;align-items:center;gap:8px;margin-top:9px;color:var(--warn)}
  .tool .ask button{padding:3px 12px;font-size:11.5px}
  .note{align-self:center;color:var(--dim2);font-size:11.5px;background:var(--tool);border:1px solid var(--line);
        border-radius:20px;padding:3px 13px;margin-bottom:12px}
  .empty{margin:auto;text-align:center;color:var(--dim);max-width:420px;padding-bottom:60px}
  .empty h2{color:var(--ink);font-size:17px;margin:0 0 10px;font-weight:600}
  .empty p{margin:7px 0;font-size:13px;line-height:1.7}

  .composer{flex:none;padding:10px 26px 20px}
  .cbox{display:flex;align-items:flex-end;gap:10px;background:var(--panel);border:1px solid var(--line);
        border-radius:15px;padding:7px 8px 7px 12px}
  .cbox textarea{flex:1;resize:none;background:none;border:0;outline:none;color:var(--ink);
                 font:inherit;font-size:13.5px;padding:6px 0;max-height:170px;min-height:26px}
  .cbox textarea::placeholder{color:var(--dim2)}
  .cbox .go{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--onacc);
            font-size:14px;flex:none}
  .cbox .go:disabled{background:var(--chip);color:var(--dim2)}
  .cadd{width:30px;height:30px;border-radius:50%;background:var(--chip);color:var(--dim);font-size:16px;flex:none}
  .composer{position:relative}
  .mention{position:absolute;left:26px;bottom:calc(100% - 6px);min-width:220px;max-width:320px;background:var(--panel);
           border:1px solid var(--line);border-radius:12px;padding:5px;box-shadow:0 8px 24px var(--shadow);z-index:5}
  .mention.hide{display:none}
  .mention div{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:8px;font-size:13px;cursor:pointer}
  .mention div.on{background:var(--on)}
  .mention .av{width:22px;height:22px;font-size:10px}
  .mention small{color:var(--dim2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ═══ Middle, studio mode: the workbench replaces the chat ═══ */
  main.ws-on>header,main.ws-on>.log,main.ws-on>.composer{display:none}
  .ws{display:none;flex:1;min-height:0;flex-direction:column}
  main.ws-on .ws{display:flex}
  body.ws-mode .side2{display:none}
  .wsh{height:54px;flex:none;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--line)}
  .wsh .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wsh small{color:var(--dim2);font-size:12px;white-space:nowrap}
  .wsh .back{padding:4px 10px}
  .quota{margin-left:auto;font-size:12px;color:var(--dim);background:var(--raise);border-radius:8px;padding:4px 10px;white-space:nowrap}
  .quota.w{color:var(--warn);background:var(--warnbg)}
  .wsb{flex:1;overflow:auto;padding:16px 20px 28px}
  .wsb .lead{color:var(--dim);font-size:13px;margin:0 0 14px;max-width:760px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .chip{background:var(--chip);color:var(--chipink);border-radius:14px;padding:3px 11px;font-size:12px;white-space:nowrap}
  @media (max-width:760px){ .quota{display:none} .wsb{padding:12px} }
  .chip.on{background:var(--accent);color:var(--onacc)}
  /* Seven states side by side: shared out across the width, scrolling sideways only when a
     column would drop below 140px — a board you have to scroll to see "approved" hides the point. */
  .kanban{display:flex;gap:10px;align-items:flex-start}
  .kcol{flex:1 1 0;min-width:140px;background:var(--side);border:1px solid var(--line);border-radius:12px;padding:8px;
        display:flex;flex-direction:column;gap:8px}
  .kcol h5{margin:2px 4px;font-size:12px;font-weight:600;color:var(--dim);display:flex;align-items:center;gap:6px}
  .kcol h5 i{width:7px;height:7px;border-radius:50%;flex:none}
  .kcol h5 span{margin-left:auto;font-weight:400;color:var(--dim2)}
  .kcol .none{color:var(--dim2);font-size:11.5px;padding:2px 4px 4px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 9px;cursor:pointer;
        display:flex;flex-direction:column;gap:5px;text-align:left}
  .card:hover{border-color:var(--accent)}
  .card img,.card .noimg{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px;background:var(--field)}
  .card .top2{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .card .code{font-size:12px;font-weight:600}
  .card .beat{font-size:12px;color:var(--dim);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .meta{display:flex;gap:8px;font-size:11px;color:var(--dim2);flex-wrap:wrap}
  .badge{font-size:10.5px;padding:1px 6px;border-radius:5px;background:var(--chip);color:var(--chipink);white-space:nowrap}
  .badge.hero{background:var(--warnbg);color:var(--warn)}
  .badge.bad{background:var(--badbg);color:var(--bad)}
  .badge.ok{background:var(--tint);color:var(--tintink)}
  .sec{margin:0 0 24px}
  .sec>h4{font-size:13px;margin:0 0 10px;font-weight:600;display:flex;align-items:center;gap:8px}
  .sec>h4 small{color:var(--dim2);font-weight:400;font-size:12px}
  .cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
  .cand{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:7px}
  .cand.picked{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
  .cand video{width:100%;aspect-ratio:16/9;background:#000;border-radius:6px}
  .cand .noplay img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px;display:block}
  .cand .noplay small{display:block;color:var(--warn);font-size:11.5px;margin-top:4px}
  .cand .dl{color:var(--dim);font-size:11.5px}
  .cand .dl:hover{color:var(--ink)}
  .cand .row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);flex-wrap:wrap}
  .cand .row .btn{margin-left:auto}
  .sheet img{max-width:100%;border:1px solid var(--line);border-radius:8px;cursor:zoom-in}
  .kv{display:grid;grid-template-columns:130px 1fr;gap:5px 14px;font-size:13px;margin:0}
  .kv dt{color:var(--dim2)} .kv dd{margin:0;white-space:pre-wrap;word-break:break-word}
  .ver{border-left:2px solid var(--line);padding:2px 0 2px 12px;margin-bottom:14px}
  .ver.now{border-left-color:var(--accent)}
  .ver .who,.rev .who{font-size:11.5px;color:var(--dim2);margin-bottom:4px}
  .ver pre,.scr pre{margin:0;white-space:pre-wrap;word-break:break-word;font:12.5px/1.65 ui-monospace,Menlo,monospace;color:var(--ink)}
  .rev{padding:8px 12px;border-radius:9px;background:var(--tool);border:1px solid var(--line);margin-bottom:8px;font-size:13px}
  .rev.reject{border-left:3px solid var(--bad)} .rev.approve{border-left:3px solid var(--ok)}
  .gens{width:100%;border-collapse:collapse;font-size:12px}
  .gens td,.gens th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  .gens th{color:var(--dim2);font-weight:500}
  .gens .err{color:var(--bad)}
  .rform{background:var(--panel);border:1px solid var(--warn);border-radius:10px;padding:12px 14px;margin:0 0 14px;max-width:760px}
  .fi{width:100%;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:9px;
      padding:9px 11px;font:inherit;font-size:13px;margin-bottom:10px;outline:none}
  textarea.fi{resize:vertical;min-height:90px;line-height:1.65}
  .rowb{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .scr{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:10px}
  .scr summary{cursor:pointer;display:flex;align-items:center;gap:10px;font-size:13.5px;list-style:none}
  .scr summary::-webkit-details-marker{display:none}
  .scr[open] summary{margin-bottom:10px}
  .bible{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
  .bitem{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
  .bitem .rowb b{font-size:13.5px}
  .thumbs{display:flex;gap:5px;flex-wrap:wrap}
  .thumbs img{height:72px;border-radius:6px;background:var(--field);cursor:zoom-in}
  .wempty{max-width:520px;margin:60px auto;text-align:center;color:var(--dim)}
  .wempty h2{color:var(--ink);font-size:17px;font-weight:600;margin:0 0 10px}
  .wempty p{font-size:13px;line-height:1.7}

  /* ═══ Right: members ═══ */
  /* Same trick as the aside: animate the width only, keep the contents pinned at
     --side2 and clipped, so nothing inside reflows on the way out. */
  .side2{width:var(--side2);flex:none;background:var(--side);border-left:1px solid var(--line);
         display:flex;flex-direction:column;overflow:hidden;
         transition:width var(--dur) var(--ease),border-left-width var(--dur) var(--ease)}
  /* An id, because a child's own width:100% (.addm) would otherwise win on
     specificity and reflow itself down to the animating width. */
  #side2>*{width:var(--side2);flex:none}
  /* visibility flips only once it has finished closing — a 0px panel must not
     still be reachable by Tab, and hiding it up front would kill the animation. */
  .side2.hide{width:0;border-left-width:0;visibility:hidden;
              transition:width var(--dur) var(--ease),border-left-width var(--dur) var(--ease),
                         visibility 0s linear var(--dur)}
  .s2h{padding:16px 18px 8px;font-size:13px;font-weight:600}
  .mem{display:flex;align-items:center;gap:10px;padding:8px 18px;font-size:13.5px}
  .mem .av{width:26px;height:26px;font-size:11px}
  .mem .lead{font-size:10.5px;padding:1px 6px;border-radius:5px;background:var(--tint);color:var(--tintink)}
  .mem .x{margin-left:auto;color:var(--dim2);font-size:15px;visibility:hidden}
  .mem:hover{background:var(--hover)}
  .mem:hover .x{visibility:visible}
  .mem .x:hover{color:var(--warn)}
  .addm{display:flex;align-items:center;gap:10px;padding:8px 18px;color:var(--dim);font-size:13.5px;
        cursor:pointer;width:100%}
  .addm:hover{color:var(--ink)}
  .addm b{width:26px;height:26px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:14px}
  /* Agent browser: live thumbnail in the right panel + full-screen takeover */
  .bw{padding:4px 16px 8px;cursor:pointer}
  .bw img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#fff}
  .bw small{display:block;color:var(--dim);font-size:11.5px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bwoff{display:flex;align-items:center;padding:2px 16px 6px;color:var(--dim2);font-size:12px}
  .bwoff .btn{margin-left:auto}
  #bwfull{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;gap:10px;padding:12px 16px}
  #bwfull[hidden]{display:none}
  #bwfull .row{display:flex;gap:8px;align-items:center}
  #bwfull input{flex:1;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:9px 12px;font:inherit;font-size:13px;outline:none}
  #bwfull .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
  #bwfull .bwbox{position:relative;max-width:100%;max-height:100%;aspect-ratio:16/10;height:100%}
  #bwfull .bwbox img{display:block;width:100%;height:100%;border:1px solid var(--line);background:#fff;user-select:none}
  #bwfull .bwbox.typing img{outline:2px solid var(--accent)}
  /* IME target: invisible but on screen; the IME only attaches while it has focus */
  #bwime{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;border:0;padding:0;resize:none}
  #bwfull small{color:var(--dim2);font-size:11.5px}
  /* Scheduled tasks */
  .s2h.sub{border-top:1px solid var(--line);margin-top:8px;padding-top:14px}
  .spd{padding:2px 18px 6px;font-size:12px;color:var(--dim)}
  .spd b{color:var(--ink);font-weight:600}
  .spd .w{color:var(--warn)}
  .rt{display:flex;flex-direction:column;gap:2px;padding:7px 18px;cursor:pointer}
  .rt:hover{background:var(--hover)}
  .rt b{font-size:13px;font-weight:500;display:flex;gap:6px;align-items:center}
  .rt small{color:var(--dim2);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rt .st{font-size:10.5px;padding:1px 6px;border-radius:5px;background:var(--on);color:var(--dim);font-weight:400}
  .rt .st.bad{background:var(--badbg);color:var(--bad)}
  .rt .st.run{background:var(--tint);color:var(--tintink)}
  .rt.off b{color:var(--dim)}
  #rsched>div{margin-bottom:10px}
  .wd{display:flex;gap:6px;flex-wrap:wrap}
  .wd label{display:flex;gap:4px;align-items:center;font-size:12.5px;background:var(--field);border:1px solid var(--line);
            border-radius:7px;padding:4px 8px;cursor:pointer}
  .wd input{accent-color:var(--accent)}
  .rhint{color:var(--dim2);font-size:11.5px;line-height:1.6;display:block;margin:-2px 0 8px}
  .rhint[hidden]{display:none}
  .s2mem{border-top:1px solid var(--line);margin-top:auto;padding:14px 18px;display:flex;
         flex-direction:column;gap:8px}
  .s2mem small{color:var(--dim2);font-size:11.5px;line-height:1.6}
  .s2mem textarea{background:var(--field);border:1px solid var(--line);border-radius:9px;color:var(--ink);
                  font:12.5px/1.6 ui-monospace,Menlo,monospace;padding:9px 11px;height:150px;resize:none;outline:none}
  .s2mem .row{display:flex;gap:8px;align-items:center}
  #smem{display:flex;flex-direction:column;gap:7px;border-top:1px solid var(--line);padding-top:11px}
  #smem textarea{height:105px}
  .btn{background:var(--chip);border-radius:8px;padding:6px 12px;font-size:12.5px;color:var(--ink)}
  .btn:hover{background:var(--chip2)}
  .btn.pri{background:var(--accent);color:var(--onacc)}

  dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:15px;
         padding:20px 22px;min-width:380px;max-width:92vw;max-height:88vh;overflow:auto}
  dialog::backdrop{background:var(--scrim)}
  dialog h4{margin:0 0 14px;font-size:15px;font-weight:600}
  dialog input[type=text],dialog input[type=password],dialog input[type=number],dialog textarea,dialog select{width:100%;background:var(--field);color:var(--ink);
    border:1px solid var(--line);border-radius:9px;padding:10px 12px;font:inherit;font-size:13.5px;
    margin-bottom:10px;outline:none}
  dialog textarea{resize:vertical;min-height:120px;line-height:1.7}
  .brow{display:flex;gap:8px}
  .brow>*{flex:1;min-width:0}
  dialog .pick{display:flex;gap:9px;align-items:center;padding:7px 4px;font-size:13.5px;cursor:pointer;border-radius:8px}
  dialog .pick:hover{background:var(--raise)}
  dialog .pick input{accent-color:var(--accent);width:15px;height:15px}
  dialog .pick .av{width:26px;height:26px;font-size:11px}
  dialog .pick small{color:var(--dim);font-size:11.5px}
  /* Action row sticks to the bottom: long dialogs (provider list, long persona) would
     otherwise push the buttons people need out of view. */
  dialog .acts{display:flex;gap:9px;justify-content:flex-end;margin-top:16px;
               position:sticky;bottom:-20px;background:var(--panel);
               padding:10px 0 20px;margin-bottom:-20px}

  /* Model providers */
  /* Scroll the list, not the whole dialog, so the action buttons stay in view */
  #plist,#klist{max-height:32vh;overflow-y:auto;margin:-4px -4px 0}
  .pitem{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:9px;cursor:pointer;
         border:1px solid transparent}
  .pitem:hover{background:var(--raise)}
  .pitem.on{border-color:var(--accent);background:var(--tint)}
  .pitem .pn{flex:1;min-width:0}
  .pitem b{display:block;font-size:13.5px;font-weight:600}
  .pitem small{display:block;color:var(--dim);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pitem .dot{width:8px;height:8px;border-radius:50%;background:var(--chip2);flex:none}
  .pitem.def .dot{background:var(--ok)}
  .psplit{border-top:1px solid var(--line);margin:14px 0 12px}
  .prow{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:2px 0 8px}
  .prow label{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--dim);cursor:pointer}
  .prow input[type=radio]{accent-color:var(--accent);width:14px;height:14px}
  .prow input[type=number]{width:120px;margin:0}
  .phint{display:block;color:var(--dim);font-size:11.5px;min-height:17px}
  .phint.bad{color:var(--code)} .phint.good{color:var(--ok)}
</style>
</head>
