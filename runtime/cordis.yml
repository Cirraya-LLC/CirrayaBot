# Per-Bot runtime composition. One file serves every Bot — all differences come from env vars:
#   BOT_PERSONA      persona (= the persona section of bots/<id>/agent.cordis.yml)
#   BOT_TOOL_BASH    bash only when 'true' (Researcher gets none; that is its no-go zone)
#   BOT_CWD          this Bot's working directory
#
# stdout belongs to JSON-RPC, so DO NOT add any console logger or terminal UI here.
- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    baseURL: !!js process.env.BOT_LLM_BASE_URL
    apiKeyEnv: BOT_LLM_API_KEY
    thinking: disabled

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  disabled: !!js process.env.BOT_TOOL_BASH !== 'true'
  config:
    cwd: !!js process.env.BOT_CWD ?? process.cwd()
    timeoutMs: 120000

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: !!js process.env.BOT_PERSONA ?? 'You are a helpful assistant.'
    workspaceContext: false
    skills:
      enabled: false
    toolJobs: false
    toolBash: !!js process.env.BOT_TOOL_BASH === 'true' ? { enableRunInBackground: false } : false

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.BOT_SESSION_DIR ?? '.dsh-sessions'
